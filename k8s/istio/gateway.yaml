apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: insurance-gateway
  namespace: insurance-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: insurance-vs
  namespace: insurance-system
spec:
  hosts:
  - "*"
  gateways:
  - insurance-gateway
  http:
  - match:
    - uri:
        prefix: /api/policies
    route:
    - destination:
        host: policy-service
        port:
          number: 3001
  - match:
    - uri:
        prefix: /api/claims
    route:
    - destination:
        host: claim-service
        port:
          number: 3002